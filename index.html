<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Penerimaan Mahasiswa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">
        <h1>Form Penerimaan Mahasiswa</h1>

        <form action="/proses-pendaftaran" method="post">
            <!-- Input text -->
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required>
            </div>

            <!-- Input email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Input password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <!-- Input number -->
            <div class="form-group">
                <label for="umur">Nilai</label>
                <input type="number" id="nilai" name="nilai" min="0" max="100">
            </div>

            <!-- Input date -->
            <div class="form-group">
                <label for="tanggal-lahir">Tanggal Lahir</label>
                <input type="date" id="tanggal-lahir" name="tanggal-lahir" required>
            </div>

            <!-- Pilihan kursus -->
            <div class="form-group">
                <label for="kursus">Pilih Mata Kuliah</label>
                <select id="kursus" name="kursus" required>
                    <option value="">-- Pilih Kursus --</option>
                    <option value="web">Desain Web</option>
                    <option value="python">Pemrograman Python</option>
                    <option value="database">Basis Data</option>
                </select>
            </div>

            <!-- 3 jenis button -->
            <div class="button-group">
                <button type="submit">Daftar</button>
                <button type="reset">Reset</button>
                <button type="button">Kembali</button>
            </div>
        </form>
    </main>
</body>

</html>
